{% extends "base.html" %}

{% block title %}Réclamation — FactuScan{% endblock %}

{% block content %}
<div class="auth-container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 2rem;">
    <div class="card auth-card" style="width: 100%; max-width: 600px; padding: 3rem;">
        <div class="auth-header" style="text-align: center; margin-bottom: 2.5rem;">
            <div class="brand-icon" style="margin: 0 auto 1.5rem; background: var(--warn);">
                <i class="bi bi-exclamation-triangle text-white" style="font-size: 1.5rem;"></i>
            </div>
            <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff;">Envoyer une Réclamation</h1>
            <p style="color: var(--t2);">Nous sommes là pour vous aider à résoudre vos problèmes.</p>
        </div>

        <form method="POST" action="{{ url_for('reclamation') }}">
            <div class="form-group mb-4">
                <label class="form-label" style="color: var(--t2); font-size: 0.9rem;">Sujet de la demande</label>
                <input type="text" name="subject" required class="auth-input no-icon" placeholder="Ex: Problème d'extraction OCR">
            </div>

            <div class="form-group mb-4">
                <label class="form-label" style="color: var(--t2); font-size: 0.9rem;">Description détaillée</label>
                <textarea name="body" required class="auth-input no-icon" rows="6" placeholder="Expliquez votre problème ici..."></textarea>
            </div>

            <button type="submit" class="btn-primary w-100" style="padding: 14px; font-size: 1rem;">
                Envoyer la demande
            </button>
        </form>
    </div>
</div>

<style>
    .auth-input {
        width: 100%; 
        background: rgba(255,255,255,0.05); 
        border: 1px solid var(--border); 
        border-radius: var(--r2); 
        padding: 0.8rem 1rem; 
        color: #fff; 
        outline: none;
    }
</style>
{% endblock %}
