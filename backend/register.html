<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - FactuScan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-container { max-width: 800px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <h2 class="text-center mb-4">Créer un compte FactuScan</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nom complet / Nom Entreprise*</label>
                        <input type="text" name="full_name" class="form-control" required placeholder="Ex: Jean Dupont">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom de l'entreprise (Optionnel)</label>
                        <input type="text" name="company_name" class="form-control" placeholder="Ex: FactuScan SARL">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nom d'utilisateur*</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email*</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mot de passe*</label>
                        <input type="password" name="password" class="form-control" required>
                        <div class="form-text">Min. 8 caractères, 1 chiffre, 1 majuscule.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirmer le mot de passe*</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Ville*</label>
                        <input type="text" name="city" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Pays*</label>
                        <select name="country" class="form-select" required>
                            <option value="">Choisir...</option>
                            <option value="Maroc">Maroc</option>
                            <option value="France">France</option>
                            <option value="Belgique">Belgique</option>
                            <option value="Canada">Canada</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Objectif d'utilisation*</label>
                        <select name="purpose_of_use" class="form-select" required>
                            <option value="Accounting">Comptabilité</option>
                            <option value="Invoice Management">Gestion de factures</option>
                            <option value="Data Analytics">Analyse de données</option>
                            <option value="Other">Autre</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type d'abonnement*</label>
                        <select name="subscription_type" class="form-select" required>
                            <option value="Basic">Basic (Gratuit)</option>
                            <option value="Pro">Pro (199 DH/mois)</option>
                            <option value="Enterprise">Enterprise (Sur mesure)</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Informations complémentaires</label>
                        <textarea name="additional_info" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2">S'inscrire</button>
                    </div>
                </div>
            </form>
            <div class="text-center mt-3">
                <p>Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
            </div>
        </div>
    </div>
</body>
</html>
